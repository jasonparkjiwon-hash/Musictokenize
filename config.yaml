seed: 42

paths:
  raw: data/raw
  processed: data/processed

data:
  session_gap_minutes: 30
  skip_ms_threshold: 30000   # play under this (or flagged) counts as a skip
  hard_skip_ms: 5000         # under this = hard skip (browsing); other skips are soft
  drop_single_hard_skips: true  # drop hard-skipped plays of songs heard once in all history
  burst_min_plays: 50        # session with >= this many plays ...
  burst_min_hard_rate: 0.7   # ... and >= this share of hard skips is a browsing burst
  min_play_count: 3          # vocab cutoff; rarer songs -> <UNK>
  val_months: 2              # last N months held out for validation

train:
  max_len: 64              # sessions are cut into windows of this many songs
  batch_size: 128
  epochs: 30
  lr: 0.003
  weight_decay: 0.00001
  grad_clip: 1.0
  patience: 5               # early stop after this many epochs without dev improvement
  dev_months: 1             # last N months of TRAIN held out for early stopping and sweeps
  include_bursts: true      # bursts stay in sequence training (skip head will mask them)
  checkpoint_dir: checkpoints

model:
  num_layers: 1
  tie_weights: true         # output layer shares the song embedding (fewer parameters)
  embed_dim: 64
  hidden_dim: 128
  dropout: 0.3

sweep:                      # grid for `python -m musictokenize.train --sweep` (picked on dev loss)
  hidden_dim: [128, 256]
  dropout: [0.3, 0.5]
