seed: 42

paths:
  raw: data/raw
  processed: data/processed

data:
  session_gap_minutes: 30
  skip_ms_threshold: 30000   # play under this counts as a skip
  min_play_count: 3          # vocab cutoff; rarer songs -> <UNK>
  val_months: 2              # last N months held out for validation

model:
  embed_dim: 64
  hidden_dim: 128
  dropout: 0.3
